version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - vasafe_net

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: senhaforte123
      DOCKER_INFLUXDB_INIT_ORG: ufsvasafe
      DOCKER_INFLUXDB_INIT_BUCKET: telemetria
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: token-secreto
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - vasafe_net

  api:
    build: ./backend
    container_name: api_backend
    restart: always
    expose:
      - "8000"
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ufsvasafe
      INFLUX_BUCKET: telemetria
      INFLUX_TOKEN: token-secreto
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - vasafe_net

  frontend:
    build: ./frontend
    container_name: frontend
    expose:
      - "5173"
    environment:
      - HOST=0.0.0.0
    depends_on:
      - api
    networks:
      - vasafe_net

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - vasafe_net

volumes:
  influxdb_data:
  mosquitto_data:
  mosquitto_log:

networks:
  vasafe_net:
    driver: bridge